server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Preserve :3000 (or any host port) from the browser. Use a temporary
    # redirect for local preview so browsers do not cache stale localhost paths.
    location = / {
        return 302 $scheme://$http_host/portfolio/;
    }

    location = /portfolio {
        return 302 $scheme://$http_host/portfolio/;
    }

    location /portfolio/ {
        rewrite ^/portfolio/(.*)$ /$1 break;
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
